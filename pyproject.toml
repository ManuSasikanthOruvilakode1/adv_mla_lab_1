[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "adv_mla_lab_1"
version = "0.0.1"
description = "exp"
authors = [
  { name = "manu" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab==4.6.1",
    "loguru",
    "mkdocs",
    "numpy>=2.5.2",
    "pandas==2.2.2",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn==1.6.1",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["adv_mla_lab_1"]
include = ["pyproject.toml", "adv_mla_lab_1/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["adv_mla_lab_1"]
force-sort-within-sections = true

